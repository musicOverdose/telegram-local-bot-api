services:
  telegram-bot-api:
    container_name: telegram-bot-api
    build:
      context: .
      dockerfile: Dockerfile
    image: telegram-bot-api:10.3
    restart: unless-stopped
    environment:
      - TELEGRAM_API_ID=${TELEGRAM_API_ID}
      - TELEGRAM_API_HASH=${TELEGRAM_API_HASH}
    command:
      - --api-id=${TELEGRAM_API_ID}
      - --api-hash=${TELEGRAM_API_HASH}
      - --local
      - --http-port=8081
      - --dir=/var/lib/telegram-bot-api
      - --temp-dir=/tmp/telegram-bot-api
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api
    networks:
      - telegram-bots
    expose:
      - "8081"
    # Port 8081 is internal to the Docker network "telegram-bots".
    # Bots connect via: http://telegram-bot-api:8081
    # For optional localhost-only testing on the host machine, uncomment:
    # ports:
    #   - "127.0.0.1:8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-sS", "-o", "/dev/null", "http://127.0.0.1:8081/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  telegram-bot-api-data:
    name: telegram-bot-api-data

networks:
  telegram-bots:
    external: true
